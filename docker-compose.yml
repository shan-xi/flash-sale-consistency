services:
  postgres:
    image: postgres:17
    container_name: flash-sale-postgres
    environment:
      POSTGRES_DB: flash_sale
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: flash
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U flash -d flash_sale" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: flash-sale-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
